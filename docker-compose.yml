# Waypoint. Run with:  docker compose up -d --build
#
# Before the first start:
#   1. Create a .env file next to this one (compose reads it automatically):
#        ENCRYPTION_KEY=<output of: openssl rand -base64 32>
#        ADMIN_USERNAME=<your username>
#        ADMIN_PASSWORD=<a temporary password, 12+ characters>
#      Keep ENCRYPTION_KEY safe: without it, saved Canvas tokens and Claude keys cannot be read
#      (you would have to enter them again). The admin login is only used if no admin exists yet,
#      and you are made to change that password at first sign-in.
#      Optional in .env: BIND_ADDRESS (which server address to listen on, default all of them),
#      TRUST_CLOUDFLARE_HEADERS, CLAUDE_MODEL, TIMEZONE.
#   2. Point your Cloudflare Tunnel's public hostname at http://<server-ip>:3000
#
# Data lives in the Docker volume "waypoint-data" (created automatically on first start; it takes its
# ownership from the image, so no host folder or chown is needed). Everything worth keeping is in it.
#   Where it is on disk:  docker volume inspect waypoint-data
#   Back it up:           docker run --rm -v waypoint-data:/data:ro -v "$PWD":/backup busybox \
#                           tar czf /backup/waypoint-data.tgz -C /data .
#   Restore (stopped):    docker run --rm -v waypoint-data:/data -v "$PWD":/backup busybox \
#                           sh -c 'tar xzf /backup/waypoint-data.tgz -C /data && chown -R 1000:1000 /data'
# "docker compose down" keeps the volume; only "down -v" or "docker volume rm" deletes it.

services:
  waypoint:
    build: .
    image: waypoint:latest
    container_name: waypoint
    restart: unless-stopped
    init: true

    environment:
      PORT: "3000"
      DATA_DIR: /data
      # The only Host header the app accepts. Anything else is refused.
      ALLOWED_HOST: waypoint.yaxley.com.au
      # The browser always sees HTTPS (Cloudflare), so cookies are marked Secure.
      COOKIE_SECURE: "true"
      # Read the visitor's real IP from Cloudflare's CF-Connecting-IP header for login rate limiting.
      # Off by default: the port is published on the network, so anything that can reach it could send a
      # fake header to dodge the limit. Turn it on (TRUST_CLOUDFLARE_HEADERS=true in .env) only if your
      # firewall lets nothing but the tunnel connect to the port. While it is off, every visitor shares
      # the tunnel's IP for rate limiting, which is fine for one user.
      TRUST_CLOUDFLARE_HEADERS: ${TRUST_CLOUDFLARE_HEADERS:-false}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env (openssl rand -base64 32)}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Model used to read notifications, and the time zone dates are read in.
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5}
      TIMEZONE: ${TIMEZONE:-Australia/Sydney}

    # Published on the server's network address so a Cloudflare Tunnel can reach it at http://<server-ip>:3000.
    # By default it listens on every address of the server. To use one address only, set BIND_ADDRESS in .env
    # (for example BIND_ADDRESS=192.168.1.50); use 127.0.0.1 if cloudflared runs on this same machine.
    # Docker publishes ports around most host firewalls (ufw, firewalld), so limit who can connect to port 3000
    # at your provider's firewall. The app also refuses any request whose Host is not ALLOWED_HOST,
    # so visiting the bare IP address gets nothing.
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:3000:3000"

    volumes:
      - waypoint-data:/data

    # The app only writes to /data. A read-only root filesystem and dropped privileges limit the damage
    # if anything in it were ever compromised.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  waypoint-data:
    # A fixed name, so it is "waypoint-data" rather than "<folder>_waypoint-data".
    name: waypoint-data
